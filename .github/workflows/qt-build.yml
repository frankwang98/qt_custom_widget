name: Qt Widgets Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          if [ "${{ matrix.qt }}" = "6" ]; then
            sudo apt-get install -y cmake ninja-build qt6-base-dev
          else
            sudo apt-get install -y cmake ninja-build qtbase5-dev
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
